spring.application.name=jobda

# H2 File Database
spring.datasource.url=jdbc:h2:file:./data/jobda;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Server
server.port=8080

# JWT
jwt.secret=jobda-secret-key-2026-must-be-at-least-32-characters-long
jwt.expiration=604800000

# Saramin Open API (https://oapi.saramin.co.kr 에서 발급)
saramin.access-key=
saramin.schedule.cron=0 0 9 * * *
saramin.schedule.count=50

# Worknet Open API (https://www.data.go.kr 에서 발급)
worknet.access-key=2655d95a-6f88-4911-bb43-4dc9fb363c7e
